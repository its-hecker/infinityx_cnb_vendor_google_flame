name: Import pinned Coral payloads into Flame

on:
  push:
    branches: [infinity-4.1-flame]
    paths: ['.github/workflows/import-coral-payloads.yml']

permissions:
  contents: read

jobs:
  import:
    if: github.event_name == 'push' && github.ref == 'refs/heads/infinity-4.1-flame'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: infinity-4.1-flame
      - uses: actions/checkout@v5
        with:
          repository: its-hecker/infinity_cnb_android_device_google_coral
          ref: infinity-4.1-flame
          path: device-reference
      - name: Copy only the verified donor payloads
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import re
          import subprocess
          provenance = json.loads(Path('tools/flame-port-provenance.json').read_text())
          donor = provenance['vendor_donor']
          assert donor['repository'] == 'its-hecker/infinity_cnb_proprietary_vendor_google_coral'
          assert re.fullmatch(r'[a-f0-9]{40}', donor['commit'])
          base = 'https://raw.githubusercontent.com/' + donor['repository'] + '/' + donor['commit'] + '/'
          for path, expected in provenance['donor_payload_sha256'].items():
              assert path.startswith('proprietary/') and '..' not in Path(path).parts
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              subprocess.run(['curl', '--fail', '--location', '--retry', '3', base + path,
                              '--output', str(target)], check=True)
              assert hashlib.sha256(target.read_bytes()).hexdigest() == expected, path
              if path.startswith('proprietary/vendor/bin/'):
                  target.chmod(0o755)
              print('Verified:', path)
          PY
      - name: Verify Flame install graph before publishing
        run: python3 tools/check_flame_port.py --device-root device-reference
      - name: Commit the verified payloads to the Flame branch only
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/infinity-4.1-flame
          python3 - <<'PY'
          import json
          from pathlib import Path
          import subprocess
          paths = json.loads(Path('tools/flame-port-provenance.json').read_text())['donor_payload_sha256']
          subprocess.run(['git', 'add', '--', *paths], check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'flame: import verified Coral Face ID and Motion Sense payloads'
            git push origin HEAD:infinity-4.1-flame
          fi
